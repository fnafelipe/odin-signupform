<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Sign Up Form</title>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="logo-container">
          <img class="logo-image" src="./odin-logo.png" alt="TOP logo" />
          <span class="logo-text">ODIN</span>
        </div>
        <div class="photo-credit"></div>
      </div>
      <main class="main-container">
        <header class="description">
          <p class="text">
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up
            now to get started
          </p>
          <p class="sub-text">You <em>know</em> you want to.</p>
        </header>
        <div class="form-container">
          <form action="#" method="post" id="sign-up-form">
            <h2 class="form-title">Let's do this!</h2>
            <div class="input-container">
              <div class="input-section">
                <label for="first-name">FIRST NAME</label>
                <input
                  type="text"
                  id="first-name"
                  name="first-name"
                  minlength="3"
                  required
                />
              </div>
              <div class="input-section">
                <label for="last-name">LAST NAME</label>
                <input
                  type="text"
                  id="last-name"
                  name="last-name"
                  minlength="3"
                  required
                />
              </div>
              <div class="input-section">
                <label for="email">EMAIL</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  minlength="7"
                  required
                />
              </div>
              <div class="input-section">
                <label for="phone-number">PHONE NUMBER</label>
                <input
                  type="tel"
                  id="phone-number"
                  name="phone-number"
                  minlength="11"
                  maxlength="11"
                  required
                />
              </div>
              <div class="input-section">
                <label for="password">PASSWORD</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  minlength="8"
                  required
                />
              </div>
              <div class="input-section">
                <label for="confirm-password">CONFIRM PASSWORD</label>
                <input
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  minlength="8"
                  required
                />
              </div>
            </div>
          </form>
          <div class="submit-section">
            <button type="submit" id="submit-button" form="sign-up-form">
              Create account
            </button>
            <p class="login">Already have an account? <a href="#">Log in</a></p>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
